<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nested scroll fixture</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
  #app { height: 100vh; overflow-y: auto; }
  section { height: 640px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
  section:nth-child(odd) { background: #e9eef5; } section:nth-child(even) { background: #f7f3ea; }
  footer { height: 220px; background: #1f2933; color: #fff; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<main id="app">
  <section>One</section><section>Two</section><section>Three</section>
  <section>Four</section><section>Five</section><section>Six</section>
  <footer>Footer — the real end</footer>
</main>
</body>
</html>
